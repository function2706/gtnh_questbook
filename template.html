<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GTNH クエストブック 日本語訳</title>
<style>
:root{
  --bg:#f6f5f1; --panel:#ffffff; --side:#efede7; --text:#23221f; --muted:#6d6a62; --line:#dcd8cf;
  --accent:#b5541c; --accent-soft:#f4e3d7; --warn-bg:#fdecea; --warn-line:#d0473b; --note-bg:#eaf2fb; --note-line:#3f7cc4;
  --mark:#ffe58a;
  --c0:#000; --c1:#1f2fa8; --c2:#1d7a1d; --c3:#0f7f80; --c4:#a51d1d; --c5:#8a2b8a; --c6:#b26a00; --c7:#7a776f;
  --c8:#55524c; --c9:#3a52d6; --ca:#2f9a2f; --cb:#0f8fa0; --cc:#d23b3b; --cd:#b23fb2; --ce:#9a8400; --cf:#23221f;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#1b1a18; --panel:#24231f; --side:#201f1c; --text:#e8e5dd; --muted:#a29e94; --line:#3a3833;
  --accent:#ec8a4e; --accent-soft:#3b2a1f; --warn-bg:#3a1f1c; --warn-line:#e0645a; --note-bg:#1c2836; --note-line:#6aa6e8;
  --mark:#6b5a14;
  --c0:#8a8780; --c1:#7b86ff; --c2:#4fcf4f; --c3:#4fd3d3; --c4:#ff6b6b; --c5:#e07be0; --c6:#ffb43a; --c7:#a9a69e;
  --c8:#8a8780; --c9:#8b9bff; --ca:#7cf07c; --cb:#7cf0f0; --cc:#ff8080; --cd:#ff8cff; --ce:#ffee66; --cf:#f4f2ec;
}}
:root[data-theme="dark"]{
  --bg:#1b1a18; --panel:#24231f; --side:#201f1c; --text:#e8e5dd; --muted:#a29e94; --line:#3a3833;
  --accent:#ec8a4e; --accent-soft:#3b2a1f; --warn-bg:#3a1f1c; --warn-line:#e0645a; --note-bg:#1c2836; --note-line:#6aa6e8;
  --mark:#6b5a14;
  --c0:#8a8780; --c1:#7b86ff; --c2:#4fcf4f; --c3:#4fd3d3; --c4:#ff6b6b; --c5:#e07be0; --c6:#ffb43a; --c7:#a9a69e;
  --c8:#8a8780; --c9:#8b9bff; --ca:#7cf07c; --cb:#7cf0f0; --cc:#ff8080; --cd:#ff8cff; --ce:#ffee66; --cf:#f4f2ec;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:15px/1.75 "Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif}
a{color:var(--accent)}
header{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;
  padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:17px;margin:0;white-space:nowrap}
header h1 small{font-weight:normal;color:var(--muted);font-size:12px;margin-left:6px}
#search{flex:1 1 220px;min-width:0;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--text);font:inherit}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--text);padding:5px 10px;font:inherit;font-size:13px;cursor:pointer}
.seg button.on{background:var(--accent);color:#fff}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px}
.tools label{display:flex;gap:4px;align-items:center;cursor:pointer;white-space:nowrap}
.btn{border:1px solid var(--line);background:transparent;color:var(--text);border-radius:6px;padding:4px 10px;font:inherit;font-size:13px;cursor:pointer}
.layout{display:grid;grid-template-columns:290px 1fr;min-height:calc(100% - 56px)}
nav{background:var(--side);border-right:1px solid var(--line);position:sticky;top:56px;height:calc(100vh - 56px);overflow:auto;padding:8px 0}
nav a{display:block;padding:6px 14px;text-decoration:none;color:var(--text);font-size:14px;line-height:1.4;border-left:3px solid transparent}
nav a:hover{background:var(--accent-soft)}
nav a.on{border-left-color:var(--accent);background:var(--accent-soft);font-weight:600}
nav .sub{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-top:2px}
nav .bar{height:3px;background:var(--line);border-radius:2px;margin-top:3px;overflow:hidden}
nav .bar{display:flex}
nav .bar i{display:block;height:100%;background:var(--accent)}
nav .bar i.ai{background:var(--c9);opacity:.6}
#chapsel{display:none;width:100%;padding:7px;font:inherit;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:6px}
main{padding:20px 28px 80px;max-width:980px;min-width:0}
.chhead h2{margin:0 0 2px;font-size:24px}
.chhead .en{color:var(--muted);font-size:13px}
.chdesc{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 16px;margin:12px 0 18px}
.meta{color:var(--muted);font-size:13px;margin:6px 0 12px}
details.q{scroll-margin-top:70px;background:var(--panel);border:1px solid var(--line);border-radius:8px;margin:0 0 8px}
details.q>summary{cursor:pointer;padding:9px 14px;list-style:none;display:flex;gap:10px;align-items:baseline}
details.q>summary::-webkit-details-marker{display:none}
details.q>summary::before{content:"▸";color:var(--muted);flex:none;transition:transform .15s}
details.q[open]>summary::before{transform:rotate(90deg)}
summary .num{color:var(--muted);font-size:12px;flex:none;min-width:2.6em;text-align:right;font-variant-numeric:tabular-nums}
summary .nm{font-weight:600;flex:1;min-width:0}
summary .ne{display:block;font-weight:normal;color:var(--muted);font-size:12px}
.badge{flex:none;font-size:11px;padding:1px 7px;border-radius:10px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.badge.untr{border-color:var(--c6);color:var(--c6)}
.badge.ai{border-color:var(--c9);color:var(--c9)}
.body{padding:2px 18px 14px 40px;border-top:1px dashed var(--line);overflow-wrap:anywhere}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.cols>div{min-width:0}
.colh{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:10px 0 2px}
.desc{white-space:normal}
.qid{font-size:11px;color:var(--muted);margin-top:8px;font-family:ui-monospace,Consolas,monospace}
.note,.warn{display:block;margin:6px 0;padding:6px 10px;border-left:3px solid;border-radius:0 6px 6px 0}
.note{background:var(--note-bg);border-color:var(--note-line)}
.warn{background:var(--warn-bg);border-color:var(--warn-line)}
.qref{font-weight:600}
.f-l{font-weight:700}.f-o{font-style:italic}.f-n{text-decoration:underline}.f-m{text-decoration:line-through}.f-n.f-m{text-decoration:underline line-through}
.f-k{filter:blur(2px)}
mark{background:var(--mark);color:inherit;padding:0 1px;border-radius:2px}
.hit{margin-bottom:6px}
.hit .where{font-size:12px;color:var(--muted)}
.empty{color:var(--muted);padding:30px 0}
footer{color:var(--muted);font-size:12px;margin-top:40px;border-top:1px solid var(--line);padding-top:10px}

/* ---- クエストマップ ---- */
.viewseg{margin-left:auto}
.chtop{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}
.mapwrap{position:relative;height:calc(100vh - 170px);min-height:420px;border:1px solid var(--line);border-radius:8px;background:var(--panel);overflow:hidden;margin-top:12px}
.mapwrap svg{width:100%;height:100%;display:block;touch-action:none;cursor:grab;user-select:none}
.mapwrap svg.drag{cursor:grabbing}
.maptools{position:absolute;left:10px;top:10px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;z-index:2}
.maptools .btn{background:var(--panel);padding:3px 9px}
.legend{display:flex;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:3px 9px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px;border:2px solid}
.edge{stroke:var(--muted);stroke-width:1.2;fill:none;opacity:.55}
.edge.imp{stroke-dasharray:4 3}
.edge.hl{stroke:var(--accent);opacity:1;stroke-width:2.2}
.edge.dim{opacity:.12}
.node rect{stroke-width:2;rx:4}
.node.s1 rect{fill:var(--accent-soft);stroke:var(--accent)}
.node.s2 rect{fill:var(--note-bg);stroke:var(--c9)}
.node.s0 rect{fill:var(--warn-bg);stroke:var(--c6)}
.node{cursor:pointer}
.node:hover rect{stroke-width:3.5}
.node.sel rect{stroke:var(--text);stroke-width:4}
.node.dim{opacity:.3}
.node .no{font-size:9px;fill:var(--muted);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.node .lb{fill:var(--text);text-anchor:middle;pointer-events:none;paint-order:stroke;stroke:var(--panel);stroke-linejoin:round}
svg.nolabel .lb{display:none}
.maptip{position:absolute;z-index:4;pointer-events:none;background:var(--text);color:var(--bg);font-size:12px;line-height:1.4;padding:3px 8px;border-radius:5px;max-width:260px;transform:translate(-50%,0);white-space:normal}
.maptip[hidden]{display:none}
.mapside{position:absolute;right:0;top:0;bottom:0;width:min(420px,100%);background:var(--bg);border-left:1px solid var(--line);overflow:auto;padding:10px 12px;z-index:3;box-shadow:-4px 0 12px rgba(0,0,0,.08)}
.mapside[hidden]{display:none}
.mapside .x{float:right}
.mapside details.q{margin-top:8px}
.mapside .body{padding:2px 12px 12px 14px}
.mapside .cols{grid-template-columns:1fr}
.rel{font-size:13px;margin:10px 0 0}
.rel h4{margin:8px 0 2px;font-size:12px;color:var(--muted);font-weight:normal}
.rel a{display:block;text-decoration:none;padding:2px 0}
.rel .other{color:var(--muted);font-size:11px;margin-left:4px}
.tomap{font-size:12px;margin-left:8px}
main.wide{max-width:none}
@media (max-width:820px){
  .mapwrap{height:calc(100vh - 210px)}
  .mapside{top:auto;left:0;width:100%;height:58%;border-left:0;border-top:1px solid var(--line)}
}
@media (max-width:820px){
  .layout{display:block}
  nav{display:none}
  #chapsel{display:block;margin-bottom:12px}
  main{padding:14px 16px 60px}
  .cols{grid-template-columns:1fr}
  .body{padding:2px 12px 12px 14px}
  header h1 small{display:none}
}
</style>
</head>
<body>
<header>
  <h1>GTNH クエストブック<small>日本語訳ビューア</small></h1>
  <input id="search" type="search" placeholder="クエスト検索（日本語・英語どちらでも）">
  <div class="tools">
    <div class="seg" id="mode">
      <button data-m="ja" class="on">日本語</button><button data-m="both">対訳</button><button data-m="en">English</button>
    </div>
    <select id="filt" class="btn"><option value="">すべて表示</option><option value="1">公式訳のみ</option><option value="2">AI訳のみ</option><option value="0">未訳のみ</option></select>
    <button class="btn" id="expand">すべて開く</button>
    <button class="btn" id="theme" title="テーマ切替">◐</button>
  </div>
</header>
<div class="layout">
  <nav id="nav"></nav>
  <main>
    <select id="chapsel"></select>
    <div id="view"></div>
    <footer>
      翻訳データ: <a href="https://github.com/GTNewHorizons/GTNH-Translations" target="_blank" rel="noopener">GTNewHorizons/GTNH-Translations</a> (GPL-3.0) の ja_JP / en_US クエスト lang。
      公式訳は <a href="https://paratranz.cn/" target="_blank" rel="noopener">ParaTranz</a> 上のコミュニティによるもの。公式訳が未訳の箇所は AI (Claude) による翻訳で補完し「AI訳」と表示。生成日: <span id="built"></span>
    </footer>
  </main>
</div>
<script id="data" type="application/json">/*__DATA__*/</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
const Q = D.quests, CH = D.chapters;
const st = { mode: 'ja', filt: '', ch: CH[0].id, q: '', view: 'list', labels: true };
const pass = id => st.filt === '' || String(Q[id].t) === st.filt;
try { const s = JSON.parse(localStorage.getItem('gtnhqb') || '{}'); if (s.mode) st.mode = s.mode; if (s.view) st.view = s.view; if (s.labels === false) st.labels = false; if (s.theme) document.documentElement.dataset.theme = s.theme; } catch (e) {}
const save = () => { try { localStorage.setItem('gtnhqb', JSON.stringify({ mode: st.mode, view: st.view, labels: st.labels, theme: document.documentElement.dataset.theme || '' })); } catch (e) {} };
document.getElementById('built').textContent = D.built;

// 旧形式 (標準base64) のクエストIDを lang 側の URL-safe 形式へ
const normId = s => s.trim().replace(/=+$/, '').replace(/\+/g, '-').replace(/\//g, '_');
const qChapter = {}, mapOf = {}, nextOf = {};
CH.forEach(c => (c.map || []).forEach(n => { if (!(n[0] in mapOf)) mapOf[n[0]] = c.id; }));
for (const k in Q) (Q[k].p || []).forEach(([p]) => (nextOf[p] = nextOf[p] || []).push(k));
CH.forEach(c => c.q.forEach(id => { if (!(id in qChapter)) qChapter[id] = c.id; }));
const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const strip = s => s.replace(/§./g, '');

// Minecraft の書式コード + BetterQuesting のタグを HTML に変換
function fmt(raw, hl) {
  if (!raw) return '';
  let s = esc(raw);
  s = s.replace(/\[url\]([\s\S]*?)\[\/url\]/g, (m, u) => `<a href="${u.replace(/§./g, '')}" target="_blank" rel="noopener">${u}</a>`);
  s = s.replace(/\[questlink\]([\s\S]*?)\[\/questlink\]/g, (m, id) => {
    const k = normId(id.replace(/§./g, '')), q = Q[k];
    return q ? `<a class="qref" href="#q=${k}">「${esc(strip(q.nj || q.ne))}」</a>` : `[quest ${id}]`;
  });
  s = s.replace(/\[quest\]([\s\S]*?)\[\/quest\]/g, '<span class="qref">「$1」</span>');
  s = s.replace(/\[(\/?)(bold)\]/g, (m, c) => c ? '</b>' : '<b>');
  s = s.replace(/\[note\]/g, '<span class="note">').replace(/\[\/note\]/g, '</span>');
  s = s.replace(/\[warn\]/g, '<span class="warn">').replace(/\[\/warn\]/g, '</span>');
  s = s.replace(/%n/g, '\n');
  // § コード: 色/装飾をspanで表現。タグ境界を壊さないよう、HTMLタグ・改行ごとにリセット
  let out = '', color = '', fl = new Set(), open = false;
  const openSpan = () => {
    const cls = []; if (color) cls.push('c'); fl.forEach(f => cls.push('f-' + f));
    if (cls.length) { out += `<span class="${[...fl].map(f => 'f-' + f).join(' ')}"${color ? ` style="color:var(--c${color})"` : ''}>`; open = true; }
  };
  const close = () => { if (open) { out += '</span>'; open = false; } };
  const parts = s.split(/(<[^>]+>|\n|§.)/);
  for (const p of parts) {
    if (!p) continue;
    if (p[0] === '§' && p.length === 2) {
      const c = p[1].toLowerCase();
      close();
      if (/[0-9a-f]/.test(c)) { color = c; fl = new Set(); }
      else if (c === 'r') { color = ''; fl = new Set(); }
      else if ('klmno'.includes(c)) fl.add(c);
      continue;
    }
    if (p === '\n' || p[0] === '<') { close(); out += p === '\n' ? '<br>' : p; continue; }
    if (!open) openSpan();
    out += hl ? highlight(p, hl) : p;
  }
  close();
  return out;
}
function highlight(text, re) { return text.replace(re, m => `<mark>${m}</mark>`); }

// ---- 章ナビ ----
const nav = document.getElementById('nav'), sel = document.getElementById('chapsel'), view = document.getElementById('view');
function chName(c) { return strip(st.mode === 'en' && c.ne ? c.ne : (c.nj || c.ne)); }
function chStats(c) { const t = c.q.filter(id => Q[id].t).length, a = c.q.filter(id => Q[id].t === 2).length; return [t, c.q.length, a]; }
function renderNav() {
  nav.innerHTML = CH.map(c => {
    const [t, n, a] = chStats(c), pct = n ? Math.round(t / n * 100) : 0, po = n ? (t - a) / n * 100 : 0, pa = n ? a / n * 100 : 0;
    return `<a href="#c=${c.id}" data-c="${c.id}" class="${c.id === st.ch && !st.q ? 'on' : ''}">${esc(chName(c))}
      <div class="sub"><span>${n} クエスト</span><span>${a ? `公式 ${Math.round(po)}% + AI ${Math.round(pa)}%` : `訳 ${pct}%`}</span></div><div class="bar"><i style="width:${po}%"></i><i class="ai" style="width:${pa}%"></i></div></a>`;
  }).join('');
  sel.innerHTML = CH.map(c => { const [t, n] = chStats(c); return `<option value="${c.id}"${c.id === st.ch ? ' selected' : ''}>${esc(chName(c))}（${n}件・訳${n ? Math.round(t / n * 100) : 0}%）</option>`; }).join('');
}
sel.onchange = () => { location.hash = 'c=' + sel.value; };

function qCard(id, idx, hl, openIt) {
  const q = Q[id]; if (!q) return '';
  const nmMain = st.mode === 'en' ? q.ne : (q.nj || q.ne);
  const sub = st.mode === 'both' && q.ne && strip(q.ne) !== strip(q.nj) ? `<span class="ne">${fmt(q.ne, hl)}</span>` : '';
  let body;
  if (st.mode === 'both') body = `<div class="cols"><div><div class="colh">日本語</div><div class="desc">${fmt(q.dj, hl)}</div></div><div><div class="colh">English</div><div class="desc">${fmt(q.de, hl)}</div></div></div>`;
  else body = `<div class="desc">${fmt(st.mode === 'en' ? q.de : q.dj, hl)}</div>`;
  return `<details class="q" id="q-${id}"${openIt ? ' open' : ''}><summary>${idx != null ? `<span class="num">${idx}</span>` : ''}<span class="nm">${fmt(nmMain, hl)}${sub}</span>${q.t === 0 ? '<span class="badge untr">未訳</span>' : q.t === 2 ? '<span class="badge ai" title="公式訳が無いためAIで翻訳">AI訳</span>' : ''}</summary>
    <div class="body">${body}<div class="qid">ID: ${id}${mapOf[id] ? `<a class="tomap" href="#m=${id}">マップで見る</a>` : ''}</div></div></details>`;
}

function renderChapter(focus) {
  const c = CH.find(x => x.id === st.ch) || CH[0];
  const [t, n, a] = chStats(c);
  const ids = c.q.map((id, i) => [id, i + 1]).filter(([id]) => pass(id));
  const desc = st.mode === 'en' ? c.de : st.mode === 'both' && c.de ? null : c.dj;
  const descHtml = desc === null
    ? `<div class="cols"><div><div class="colh">日本語</div>${fmt(c.dj)}</div><div><div class="colh">English</div>${fmt(c.de)}</div></div>` : fmt(desc);
  const head = `<div class="chtop"><div class="chhead"><h2>${fmt(st.mode === 'en' && c.ne ? c.ne : c.nj)}</h2>${st.mode !== 'en' && c.ne ? `<div class="en">${esc(strip(c.ne))}</div>` : ''}</div>
    ${c.map ? `<div class="seg viewseg"><button data-v="list" class="${st.view !== 'map' ? 'on' : ''}">リスト</button><button data-v="map" class="${st.view === 'map' ? 'on' : ''}">マップ</button></div>` : ''}</div>`;
  if (c.map && st.view === 'map') {
    view.innerHTML = head + `<div class="meta">${n} クエスト ／ 公式訳 ${t - a} ／ AI訳 ${a} ／ 未訳 ${n - t} ／ ドラッグで移動・ホイールで拡大・クリックで詳細</div><div class="mapwrap"></div>`;
    document.querySelector('main').classList.add('wide');
    window.scrollTo(0, 0); renderMap(c, focus); return;
  }
  document.querySelector('main').classList.remove('wide');
  view.innerHTML = head + `
    ${descHtml ? `<div class="chdesc">${descHtml}</div>` : ''}
    <div class="meta">${n} クエスト ／ 公式訳 ${t - a} ／ AI訳 ${a} ／ 未訳 ${n - t}${st.filt !== '' ? ` ／ 絞り込み: ${ids.length} 件` : ''}</div>
    ${ids.map(([id, i]) => qCard(id, i, null, id === focus)).join('') || '<div class="empty">該当なし</div>'}`;
  if (focus) { requestAnimationFrame(() => { const el = document.getElementById('q-' + focus); if (el) el.scrollIntoView({ block: 'start' }); }); }
  else window.scrollTo(0, 0);
}

function renderSearch() {
  const words = st.q.trim().split(/\s+/).filter(Boolean);
  const res = words.map(w => new RegExp(w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi'));
  const hl = new RegExp(words.map(w => w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|'), 'gi');
  const hits = [];
  for (const c of CH) for (const id of c.q) {
    if (qChapter[id] !== c.id) continue;
    const q = Q[id]; if (!pass(id)) continue;
    const hay = strip(q.nj + '\n' + q.ne + '\n' + q.dj + '\n' + q.de);
    if (res.every(r => { r.lastIndex = 0; return r.test(hay); })) {
      const nameHit = res.some(r => { r.lastIndex = 0; return r.test(strip(q.nj + q.ne)); });
      hits.push([nameHit ? 0 : 1, c, id]);
    }
  }
  hits.sort((a, b) => a[0] - b[0]);
  const LIM = 200;
  view.innerHTML = `<div class="chhead"><h2>検索: ${esc(st.q)}</h2></div><div class="meta">${hits.length} 件${hits.length > LIM ? `（上位 ${LIM} 件を表示）` : ''}</div>` +
    (hits.slice(0, LIM).map(([, c, id]) => `<div class="hit"><div class="where">${esc(chName(c))}</div>${qCard(id, null, hl, false)}</div>`).join('') || '<div class="empty">見つかりませんでした</div>');
  window.scrollTo(0, 0);
}


// ---- クエストマップ ----
function renderMap(c, focus) {
  const nodes = c.map, pos = {};
  nodes.forEach(n => pos[n[0]] = n);
  const idx = {}; c.q.forEach((id, i) => idx[id] = i + 1);
  let minX = 1e9, minY = 1e9, maxX = -1e9, maxY = -1e9;
  nodes.forEach(([, x, y, w, hh]) => { minX = Math.min(minX, x); minY = Math.min(minY, y); maxX = Math.max(maxX, x + w); maxY = Math.max(maxY, y + hh); });
  // 同じ章内の前提だけを線にする (種類2=非表示は描かない)
  const edges = [];
  nodes.forEach(([id]) => ((Q[id] && Q[id].p) || []).forEach(([pid, ty]) => { if (pos[pid] && ty !== 2) edges.push([pid, id, ty]); }));
  const cx = n => n[1] + n[3] / 2, cy = n => n[2] + n[4] / 2;
  const qname = id => strip(Q[id] ? (st.mode === 'en' ? Q[id].ne : (Q[id].nj || Q[id].ne)) : id);
  const edgeSvg = edges.map(([a, b, ty]) => {
    const A = pos[a], B = pos[b];
    // 終点をノード枠の手前で止めて矢印を見せる
    const x1 = cx(A), y1 = cy(A), x2 = cx(B), y2 = cy(B), dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy) || 1;
    const r = Math.min(B[3], B[4]) / 2 + 3, r0 = Math.min(A[3], A[4]) / 2;
    return `<line class="edge${ty === 1 ? ' imp' : ''}" data-a="${a}" data-b="${b}" x1="${x1 + dx / L * r0}" y1="${y1 + dy / L * r0}" x2="${x2 - dx / L * r}" y2="${y2 - dy / L * r}" marker-end="url(#arr)"/>`;
  }).join('');
  const nodeSvg = nodes.map(([id, x, y, w, hh]) => {
    const q = Q[id], s = q ? q.t : 0, show = !st.filt || (q && String(q.t) === st.filt);
    return `<g class="node s${s}${show ? '' : ' dim'}" data-id="${id}">
      <rect x="${x}" y="${y}" width="${w}" height="${hh}"/><text class="no" x="${x + w / 2}" y="${y + hh / 2}">${idx[id] || ''}</text>
      <text class="lb" x="${x + w / 2}"></text></g>`;
  }).join('');
  const box = view.querySelector('.mapwrap');
  box.innerHTML = `<div class="maptools"><button class="btn" data-z="in">＋</button><button class="btn" data-z="out">－</button><button class="btn" data-z="fit">全体</button>
      <label class="btn" style="display:flex;gap:4px;align-items:center"><input type="checkbox" id="lbl" ${st.labels ? 'checked' : ''}>名前</label>
      <span class="legend"><span><i style="background:var(--accent-soft);border-color:var(--accent)"></i>公式訳</span><span><i style="background:var(--note-bg);border-color:var(--c9)"></i>AI訳</span><span><i style="background:var(--warn-bg);border-color:var(--c6)"></i>未訳</span></span></div>
    <svg class="${st.labels ? '' : 'nolabel'}"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="var(--muted)"/></marker></defs>
      <g class="vp">${edgeSvg}${nodeSvg}</g></svg><div class="maptip" hidden></div><aside class="mapside" hidden></aside>`;
  const svg = box.querySelector('svg'), vp = svg.querySelector('.vp'), side = box.querySelector('.mapside');
  const S = { k: 1, tx: 0, ty: 0 };
  // ---- タイトル: 画面上 11px 固定。周囲のノード/ラベルと重ならない幅だけ表示し、入らない分は … で省略 ----
  const FS = 11, LH = 14, MAXW = 150;
  const items = [...vp.querySelectorAll('.node')].map(g => {
    const n = pos[g.dataset.id];
    return { el: g.querySelector('.lb'), name: qname(n[0]), cx: cx(n), x: n[1], y: n[2], w: n[3], h: n[4] };
  });
  const textW = s => { let w = 0; for (const ch of s) w += ch.charCodeAt(0) > 0x2e7f ? 1 : 0.58; return w; };  // em 単位
  const fitText = (s, em) => {
    if (textW(s) <= em) return s;
    let out = '', w = 0;
    for (const ch of s) { const cw = ch.charCodeAt(0) > 0x2e7f ? 1 : 0.58; if (w + cw > em - 1) break; out += ch; w += cw; }
    return out ? out + '…' : '';
  };
  let lblTimer = 0, lastK = 0;
  function layoutLabels() {
    if (!st.labels || Math.abs(S.k - lastK) < 1e-6) return;
    lastK = S.k;
    const k = S.k, fs = FS / k, band = LH / k, gapPad = 4 / k;
    for (const a of items) {
      const top = a.y + a.h + 1 / k, bot = top + band;
      let half = MAXW / 2 / k;
      for (const b of items) {
        if (b === a) continue;
        const dx = Math.abs(b.cx - a.cx);
        if (dx > half * 2 + b.w) continue;
        // 下にあるノード本体とぶつかる範囲
        if (b.y < bot && b.y + b.h > top) half = Math.min(half, dx - b.w / 2 - gapPad);
        // 同じ段のラベル同士は隙間を半分ずつ使う
        const bt = b.y + b.h + 1 / k;
        if (bt < bot && bt + band > top) half = Math.min(half, dx / 2 - gapPad);
      }
      const txt = half > 0 ? fitText(a.name, half * 2 / fs) : '';
      a.el.textContent = txt.replace('…', '').length >= 3 || txt === a.name ? txt : '';
      a.el.setAttribute('y', top + fs * 0.95);
      a.el.setAttribute('font-size', fs);
      a.el.setAttribute('stroke-width', 3 / k);
    }
  }
  const apply = () => {
    vp.setAttribute('transform', `translate(${S.tx},${S.ty}) scale(${S.k})`);
    clearTimeout(lblTimer); lblTimer = setTimeout(layoutLabels, 80);
  };
  const fit = () => {
    const W = svg.clientWidth, H = svg.clientHeight, pad = 30;
    S.k = Math.min((W - pad * 2) / (maxX - minX + 20), (H - pad * 2 - 30) / (maxY - minY + 20), 3);
    S.tx = (W - (maxX - minX) * S.k) / 2 - minX * S.k; S.ty = pad + 30 - minY * S.k; apply();
  };
  const zoomAt = (f, px, py) => { const k = Math.max(0.15, Math.min(6, S.k * f)); f = k / S.k; S.tx = px - (px - S.tx) * f; S.ty = py - (py - S.ty) * f; S.k = k; apply(); };
  const center = id => {
    const n = pos[id]; if (!n) return;
    const W = svg.clientWidth, H = svg.clientHeight, narrow = innerWidth <= 820;
    if (S.k < 1.2) S.k = 1.5;
    S.tx = (narrow ? W / 2 : (W - 420) / 2) - cx(n) * S.k;
    S.ty = (narrow ? H * 0.2 : H / 2) - cy(n) * S.k; apply();
  };
  // ドラッグ移動・ホイール/ピンチ拡大
  const pts = new Map(); let moved = 0, pinch0 = null;
  svg.addEventListener('pointerdown', e => {
    pts.set(e.pointerId, [e.clientX, e.clientY]); moved = 0; svg.classList.add('drag');
    if (pts.size === 2) { const [a, b] = [...pts.values()]; pinch0 = Math.hypot(a[0] - b[0], a[1] - b[1]); }
  });
  svg.addEventListener('pointermove', e => {
    if (!pts.has(e.pointerId)) return;
    const [px, py] = pts.get(e.pointerId), dx = e.clientX - px, dy = e.clientY - py;
    pts.set(e.pointerId, [e.clientX, e.clientY]);
    if (pts.size === 2) {
      const [a, b] = [...pts.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]), r = svg.getBoundingClientRect();
      if (pinch0) zoomAt(d / pinch0, (a[0] + b[0]) / 2 - r.left, (a[1] + b[1]) / 2 - r.top);
      pinch0 = d; moved += 10; return;
    }
    if (Math.abs(dx) + Math.abs(dy) > 0 && moved + Math.abs(dx) + Math.abs(dy) > 5 && !svg.hasPointerCapture(e.pointerId)) svg.setPointerCapture(e.pointerId);
    moved += Math.abs(dx) + Math.abs(dy); S.tx += dx; S.ty += dy; apply();
  });
  const up = e => { pts.delete(e.pointerId); if (pts.size < 2) pinch0 = null; if (!pts.size) svg.classList.remove('drag'); };
  svg.addEventListener('pointerup', up); svg.addEventListener('pointercancel', up);
  svg.addEventListener('wheel', e => { e.preventDefault(); const r = svg.getBoundingClientRect(); zoomAt(Math.exp(-e.deltaY * 0.0015), e.clientX - r.left, e.clientY - r.top); }, { passive: false });
  svg.addEventListener('click', e => { if (moved > 5) return; const g = e.target.closest('.node'); selectNode(g ? g.dataset.id : null); });
  box.querySelector('.maptools').addEventListener('click', e => {
    const z = e.target.dataset.z; if (!z) return;
    if (z === 'fit') fit(); else zoomAt(z === 'in' ? 1.4 : 1 / 1.4, svg.clientWidth / 2, svg.clientHeight / 2);
  });
  box.querySelector('#lbl').onchange = e => { st.labels = e.target.checked; svg.classList.toggle('nolabel', !st.labels); lastK = 0; layoutLabels(); save(); };
  // ホバーでタイトル全文
  const tip = box.querySelector('.maptip');
  svg.addEventListener('pointerover', e => {
    const g = e.target.closest('.node'); if (!g || e.pointerType === 'touch') { tip.hidden = true; return; }
    const r = g.querySelector('rect').getBoundingClientRect(), b = box.getBoundingClientRect();
    tip.textContent = qname(g.dataset.id); tip.hidden = false;
    tip.style.left = (r.left + r.width / 2 - b.left) + 'px'; tip.style.top = (r.bottom - b.top + 4) + 'px';
  });
  svg.addEventListener('pointerout', e => { if (e.target.closest('.node')) tip.hidden = true; });
  svg.addEventListener('pointerdown', () => { tip.hidden = true; });

  function selectNode(id) {
    svg.querySelectorAll('.node').forEach(g => g.classList.toggle('sel', g.dataset.id === id));
    svg.querySelectorAll('.edge').forEach(l => {
      const on = !!id && (l.dataset.a === id || l.dataset.b === id);
      l.classList.toggle('hl', on); l.classList.toggle('dim', !!id && !on);
    });
    if (!id) { side.hidden = true; return; }
    const pre = ((Q[id] && Q[id].p) || []).map(p => p[0]), next = nextOf[id] || [];
    const link = k => {
      const ch = !pos[k] && CH.find(x => x.id === (mapOf[k] || qChapter[k]));
      return `<a href="#" data-go="${k}">${esc(qname(k))}${ch ? `<span class="other">（${esc(chName(ch))}）</span>` : ''}</a>`;
    };
    side.innerHTML = `<button class="btn x" data-close>✕</button>${qCard(id, idx[id], null, true)}
      <div class="rel">${pre.length ? `<h4>前提クエスト</h4>${pre.map(link).join('')}` : ''}${next.length ? `<h4>次に開くクエスト</h4>${next.map(link).join('')}` : ''}</div>`;
    side.hidden = false; side.scrollTop = 0;
  }
  side.addEventListener('click', e => {
    if (e.target.closest('[data-close]')) { selectNode(null); return; }
    const a = e.target.closest('[data-go]'); if (!a) return;
    e.preventDefault();
    const k = a.dataset.go;
    if (pos[k]) { selectNode(k); center(k); } else location.hash = 'm=' + k;
  });
  fit();
  if (focus && pos[focus]) { selectNode(focus); center(focus); }
}

function route() {
  const h = decodeURIComponent(location.hash.slice(1));
  let focus = null;
  if (h.startsWith('c=')) st.ch = h.slice(2);
  else if (h.startsWith('q=')) { focus = h.slice(2); if (qChapter[focus]) st.ch = qChapter[focus]; st.view = 'list'; }
  else if (h.startsWith('m=')) { focus = h.slice(2); if (mapOf[focus]) { st.ch = mapOf[focus]; st.view = 'map'; } }
  st.q = ''; document.getElementById('search').value = '';
  renderNav(); renderChapter(focus);
}
window.addEventListener('hashchange', route);

let tmr;
document.getElementById('search').addEventListener('input', e => {
  clearTimeout(tmr);
  tmr = setTimeout(() => { st.q = e.target.value; if (st.q.trim()) { renderNav(); renderSearch(); } else route(); }, 200);
});
function rerender() { renderNav(); st.q.trim() ? renderSearch() : renderChapter(); }
document.getElementById('mode').addEventListener('click', e => {
  const m = e.target.dataset.m; if (!m) return;
  st.mode = m; save();
  document.querySelectorAll('#mode button').forEach(b => b.classList.toggle('on', b.dataset.m === m));
  rerender();
});
view.addEventListener('click', e => { const b = e.target.closest('[data-v]'); if (!b) return; st.view = b.dataset.v; save(); renderChapter(); });
document.getElementById('filt').onchange = e => { st.filt = e.target.value; rerender(); };
document.getElementById('expand').onclick = e => {
  const all = [...view.querySelectorAll('details.q')], open = !all.every(d => d.open);
  all.forEach(d => d.open = open); e.target.textContent = open ? 'すべて閉じる' : 'すべて開く';
};
document.getElementById('theme').onclick = () => {
  const r = document.documentElement, dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  r.dataset.theme = dark ? 'light' : 'dark'; save();
};
document.querySelectorAll('#mode button').forEach(b => b.classList.toggle('on', b.dataset.m === st.mode));
route();
</script>
</body>
